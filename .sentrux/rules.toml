# ============================================================
# sentrux 架构门禁 —— 住院病案管理系统（yrzk）
# 建立于 2026-10-16，基线见同目录 baseline.json（Quality 5971/10000）
#
# 阈值策略：略低于当前实测值 → 锁住现状、阻止劣化；
# 结构改善后逐级上调。当前瓶颈 = modularity（3214），主攻方向。
#
# 用法：
#   sentrux check .   → 绝对门禁（CI 用，违规退出码 1）
#   sentrux gate .    → 相对门禁（对比 baseline，抓本会话劣化）
#
# 字段有效性（v0.5.7 探针实测）：
#   生效：min_quality / min_modularity / min_acyclicity / max_cycles
#        / min_equality / min_redundancy / no_god_files / max_fn_lines
#   陷阱：max_depth 会被引擎静默忽略（勿写）；
#        坏 rules.toml → 警告后视为"无规则"，CI 里注意检查退出码语义
# ============================================================

[constraints]
# 总质量分（0-1 几何均值）——当前 0.597
min_quality = 0.55

# 模块性（Newman 模块度）——当前 0.321，本项目最大短板
min_modularity = 0.28

# 无环性——当前 1.0（零循环依赖）。锁死：新增任何循环即刻变红
min_acyclicity = 1.0
max_cycles = 0

# 均衡性（复杂度分布均匀度）——当前 0.410
min_equality = 0.38

# 冗余度（死代码/重复代码）——当前 0.719
min_redundancy = 0.65

# ------------------------------------------------------------
# 已量化、暂未启用的约束（当前状态下会红，需先清理结构债）：
#   god file = 1 个：frontend/index.html（fan-out=18，>15 阈值）
#     → 收敛后启用 no_god_files = true
#   复杂函数 = 54 个 → 重构后启用 max_fn_lines = 100
# ------------------------------------------------------------
